<style>

  --rate-1-bg: rgba(255, 241, 242, 0.85);
  --rate-1-bd: #fecdd3;
  --rate-2-fg: #92400e;
  --rate-2-bg: rgba(255, 251, 235, 0.85);
  --rate-2-bd: #fde68a;

/* 坐标全部由 CuteMascot.tsx 的 SVG 换算而来：left/top/width/height = SVG 值 × 0.8px。
   改形状请回去对照那份 SVG，不要凭手感调。 */

.mascot { display: flex; align-items: center; gap: 10px; }

.bot {
  position: relative;
  flex: none;
  width: 80px;
  height: 80px;
  animation: hc-bot-float 3s ease-in-out infinite;
}

/* 原型是 blur-xl 的光晕。用 radial-gradient 而不是 filter: blur——
   后者在低端安卓上会把整个页面推进合成层，代价与收益不成比例。 */
.aura {
  position: absolute;
  left: 4px;
  top: 7px;
  width: 72px;
  height: 65px;
  border-radius: var(--r-full);
  background: radial-gradient(
    closest-side,
    rgba(192, 132, 252, 0.5),
    rgba(244, 114, 182, 0.24) 68%,
    rgba(244, 114, 182, 0) 100%
  );
}

/* 耳朵（ellipse cx14/86 cy48 rx8 ry12，各自外旋 15°） */
.ear {
  position: absolute;
  top: 29px;
  width: 13px;
  height: 19px;
  border-radius: var(--r-full);
  background: linear-gradient(135deg, #e9d5ff, #a855f7);
}
.ear-l { left: 5px; transform: rotate(-15deg); }
.ear-r { right: 5px; transform: rotate(15deg); }

/* 头（ellipse cx50 cy48 rx36 ry32 + 2.5 白描边） */
.head {
  position: absolute;
  left: 11px;
  top: 13px;
  width: 57.5px;
  height: 51px;
  border: 2px solid #ffffff;
  border-radius: 50%;
  background: linear-gradient(135deg, #f5edff 0%, #e5d4ff 40%, #c4a8ff 100%);
  box-shadow: 0 4px 10px rgba(139, 92, 246, 0.28);
}

/* 面罩（rect x24 y28 w52 h38 r19） */
.visor {
  position: absolute;
  left: 19px;
  top: 22.5px;
  width: 41.5px;
  height: 30.5px;
  border-radius: 15px;
  background: linear-gradient(180deg, #2e1065, #4c1d95);
}

/* 弯月眼（path M32,46 Q38,38 44,46）：只留上边框 + 50% 圆角就是那条弧 */
.eye {
  position: absolute;
  top: 30.5px;
  width: 9.5px;
  height: 6.5px;
  border-top: 2.5px solid #a7f3d0;
  border-radius: 50%;
}
.eye-l { left: 25.5px; }
.eye-r { left: 45px; }

/* 腮红（ellipse cy54 rx4 ry2，压在面罩上） */
.cheek {
  position: absolute;
  top: 42.5px;
  width: 6.5px;
  height: 3.5px;
  border-radius: var(--r-full);
  background: #f472b6;
  opacity: 0.8;
}
.cheek-l { left: 21px; }
.cheek-r { left: 53px; }

/* 天线 + 发光顶珠（line y8→16，circle cy7 r4.5，外加一点高光） */
.antenna {
  position: absolute;
  left: 39px;
  top: 6.5px;
  width: 2.5px;
  height: 7px;
  border-radius: var(--r-full);
  background: #c4b5fd;
}
.antenna-tip {
  position: absolute;
  left: 36.5px;
  top: 2px;
  width: 7.5px;
  height: 7.5px;
  border-radius: var(--r-full);
  background: #f43f5e;
}
.antenna-tip::after {
  content: '';
  position: absolute;
  left: 2px;
  top: 1px;
  width: 2.5px;
  height: 2.5px;
  border-radius: var(--r-full);
  background: #ffffff;
}

/* 悬浮的身体球（ellipse cx50 cy86 rx16 ry11） */
.body {
  position: absolute;
  left: 27px;
  top: 60px;
  width: 25.5px;
  height: 17.5px;
  border: 1.5px solid #ffffff;
  border-radius: 50%;
  background: linear-gradient(135deg, #f5edff 0%, #e5d4ff 40%, #c4a8ff 100%);
}

@keyframes hc-bot-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

.bubble {
  position: relative;
  flex: 1;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-xs);
}
.bubble::before {
  content: '';
  position: absolute;
  left: -6px;
  top: 17px;
  width: 10px;
  height: 10px;
  transform: rotate(45deg);
  background: var(--surface);
  border-left: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.bubble-text {
  font-size: 12px;
  line-height: 1.65;
  color: var(--text-2);
}

</style>
<div class="col"><h3>WXSS 换算稿（1rpx = 0.5px）</h3>
<div class="mascot">

  </div>

  <div class="bubble">
    <span class="bubble-text"></span>
  </div>
</div>

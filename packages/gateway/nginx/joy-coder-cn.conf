# joy-coder.cn 静态说明站。API 网关仍使用 huoci.conf，两者不要合并。

server {
    listen 80;
    listen [::]:80;
    server_name joy-coder.cn www.joy-coder.cn;
    return 301 https://$host$request_uri;
}

server {
    # Ubuntu 24.04 自带 nginx 1.24.0，使用兼容语法。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name joy-coder.cn www.joy-coder.cn;

    ssl_certificate     /etc/nginx/ssl/joy-coder-cn/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/joy-coder-cn/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:JOY_CODER_CN_SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/joy-coder.cn;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

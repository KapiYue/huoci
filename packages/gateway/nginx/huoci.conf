# 活词网关。`design.md` §12.1 T8：**nginx 唯一入口 + location 分流**。
#
#   /auth/v1  /rest/v1  → 无状态透传到词鲸 Supabase，开 keepalive
#   /wx/*      /functions/v1（需内容审核的）→ 本机 Flask（有状态）
#
# 主流量**不进 Flask**：Python 那一跳既没必要，又会把跨境延迟叠上进程开销。
#
# 选址：深圳 / 广州（离新加坡最近）。跨境链路抖动是已识别的中风险项（§12），
# keepalive 是对策的一半，另一半是客户端的读缓存 + 写队列（T1-c）。

# 复用到 Supabase 的 TLS 连接。不开 keepalive 的话每个请求都要跨境握手一次，
# 通勤场景下这一项就能决定「卡不卡」。
upstream supabase_upstream {
    server YOUR_PROJECT.supabase.co:443;
    keepalive 32;
    keepalive_timeout 120s;
    keepalive_requests 1000;
}

upstream huoci_flask {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.joy-coder.cn;
    return 301 https://$host$request_uri;
}

server {
    # http2 写在 listen 行上是 nginx < 1.25.1 的语法。
    # Ubuntu 24.04 自带 nginx 1.24.0，用新写法 `http2 on;` 会报
    # `unknown directive "http2"` 而整个配置加载不了。
    # 将来升到 1.25.1+ 会看到 deprecated 警告，那时再换成独立的 `http2 on;`。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.joy-coder.cn;

    ssl_certificate     /etc/nginx/ssl/huoci/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/huoci/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:HUOCI_SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;

    # ── 无状态透传：认证与数据 ───────────────────────────────
    location ~ ^/(auth|rest)/v1/ {
        proxy_pass https://supabase_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name YOUR_PROJECT.supabase.co;
        proxy_set_header Host YOUR_PROJECT.supabase.co;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
    }

    # ── 有状态：微信侧（AppSecret、openid 映射、msgSecCheck）──
    location /wx/ {
        proxy_pass http://huoci_flask;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Edge Functions：AI 内容必须过审核，所以走 Flask 而不是直通 ──
    location /functions/v1/ {
        # ⚠️ 末尾的 /hc/functions/v1/ 一个字符都不能少 —— 带路径才会重写，不带就是原样透传，
        #    透传会落到词鲸 app.py 自己那条 /functions/v1/<path> 路由上，AI 文本绕过 msgSecCheck。
        #    实测踩过：写成 /hc/function/v1（少 s、少尾斜杠）→ Flask 收到
        #    /hc/function/v1not-in-whitelist → 404 HTML（207 字节），而正确时是 404 JSON（68 字节）。
        proxy_pass http://huoci_flask/hc/functions/v1/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AI 生成慢，这里放宽；>10s 的 p95 才考虑上任务表 + 轮询（T9）
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://huoci_flask;
    }
}
